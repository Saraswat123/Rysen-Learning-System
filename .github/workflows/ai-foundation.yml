name: Rysen AI foundation

on:
  push:
    paths:
      - "ml/**"
      - "ai/**"
      - "docs/AI_*.md"
      - "docs/ai/**"
      - "memory.md"
      - "skills/rysen-ai/**"
      - "docker-compose.ai.yml"
      - ".github/workflows/ai-foundation.yml"
  pull_request:
    paths:
      - "ml/**"
      - "ai/**"
      - "docs/AI_*.md"
      - "docs/ai/**"
      - "memory.md"
      - "skills/rysen-ai/**"
      - "docker-compose.ai.yml"
      - ".github/workflows/ai-foundation.yml"

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked Groq secrets
        run: python ml/evaluation/check_secrets.py
      - name: Validate AI contracts without secrets or network calls
        run: python ml/evaluation/validate_contract.py
      - name: Test safe Groq diagnostics
        run: python -m unittest discover -s ml/evaluation -p 'test_*.py'
      - name: Test RAG chunking and latency calculations
        run: python -m unittest discover -s ml/rag -p 'test_*.py'
      - name: Build local Docker validation image
        run: docker compose -f docker-compose.ai.yml build
      - name: Run local Docker validation
        run: docker compose -f docker-compose.ai.yml run --rm ai-contract-check
